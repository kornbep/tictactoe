
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic-Tac-Toe Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="game-container">
        <h1>Tic-Tac-Toe</h1>
        <p class="subtitle">Choose your game mode!</p>

        <!-- Game mode selection -->
        <div id="modeSelection" class="mode-selection">
            <button id="aiModeBtn" class="mode-btn">
                🤖 Player vs AI
                <span>Choose your difficulty</span>
            </button>

            <button id="twoPlayerModeBtn" class="mode-btn">
                👥 2 Players
                <span>Play with a friend</span>
            </button>
        </div>

        <!-- AI difficulty selection -->
        <div id="difficultySelection" class="mode-selection" hidden>
            <h2>Choose Difficulty</h2>

            <button class="mode-btn easy-btn"
                    data-difficulty="easy">
                🟢 Easy
                <span>Random moves</span>
            </button>

            <button class="mode-btn difficult-btn"
                    data-difficulty="difficult">
                🟡 Difficult
                <span>Tries to win and block you</span>
            </button>

            <button class="mode-btn hard-btn"
                    data-difficulty="hard">
                🔴 Hard
                <span>Unbeatable AI</span>
            </button>

            <button id="backBtn" class="change-mode-btn">
                ← Back to Game Modes
            </button>
        </div>

        <!-- Game board -->
        <div id="gameArea" hidden>
            <p id="modeLabel" class="mode-label"></p>
            <h2 id="status">Player X's turn</h2>

            <div class="board" id="board">
                <button class="cell" data-index="0"></button>
                <button class="cell" data-index="1"></button>
                <button class="cell" data-index="2"></button>
                <button class="cell" data-index="3"></button>
                <button class="cell" data-index="4"></button>
                <button class="cell" data-index="5"></button>
                <button class="cell" data-index="6"></button>
                <button class="cell" data-index="7"></button>
                <button class="cell" data-index="8"></button>
            </div>

            <!-- Scoreboard -->
            <div class="scoreboard">
                <div class="score x-score">
                    <span>Player X</span>
                    <strong id="scoreX">0</strong>
                </div>

                <div class="score o-score">
                    <span id="playerOLabel">Player O</span>
                    <strong id="scoreO">0</strong>
                </div>
            </div>

            <button id="restartBtn" class="restart-btn">
                Restart Round
            </button>

            <button id="changeModeBtn" class="change-mode-btn">
                Change Game Mode
            </button>
        </div>
    </div>

    <script src="script.js"></script>

</body>
</html>
